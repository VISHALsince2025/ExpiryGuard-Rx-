<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Hexagon -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <rect x="12" y="12" width="76" height="76" rx="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Medical Cross & Rx Motifs -->
  <path d="M50 24 V76 M24 50 H76" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- Capsule Icon in Center Overlay -->
  <g transform="translate(50, 50) rotate(-35) translate(-14, -8)">
    <rect x="0" y="0" width="28" height="16" rx="8" fill="#ffffff" />
    <path d="M0 0 H14 V16 H0 Z" rx="8" fill="url(#accentGrad)" />
    <rect x="0" y="0" width="28" height="16" rx="8" fill="none" stroke="#0f172a" stroke-width="1" stroke-opacity="0.2"/>
  </g>
</svg>
